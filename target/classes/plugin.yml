name: BetterLoginGui
version: '${project.version}'
main: io.github.faboit1.blg.BLGPlugin
api-version: '1.21'
description: Modern dialog-based login/register UI layer over AuthMe.
authors:
  - Faboit1

softdepend:
  - AuthMe

commands:
  openlogin:
    description: Opens the login dialog.
    usage: /openlogin
    permission: blg.openlogin
  openregister:
    description: Opens the register dialog.
    usage: /openregister
    permission: blg.openregister
  openauto:
    description: Opens the correct dialog for yourself, or forces the login dialog for a target player.
    usage: /openauto [player]
    permission: blg.openauto
  openprelogin:
    description: Opens the pre-login choice dialog (one-click login/register) for yourself or a target player.
    usage: /openprelogin [player]
    permission: blg.openprelogin
  updaterules:
    description: Reloads rules.txt, backs up the old version, and invalidates cached acceptances if changed.
    usage: /updaterules
    permission: blg.admin
  blgreload:
    description: Reloads config.yml and rules.txt without restarting the server.
    usage: /blgreload
    permission: blg.admin

  # Internal commands used by dialog submit/navigation buttons – not for direct player use.
  blg_login_submit:
    description: Internal – called by the login dialog submit button.
    usage: /blg_login_submit <password>
    permission: blg.internal
  blg_register_submit:
    description: Internal – called by the register dialog submit button.
    usage: /blg_register_submit <password> <confirmPassword>
    permission: blg.internal
  blg_login_choice:
    description: Internal – called by the login-stub dialog button; opens the actual login form.
    usage: /blg_login_choice
    permission: blg.internal
  blg_register_choice:
    description: Internal – called by the register-stub dialog button; opens the actual register form.
    usage: /blg_register_choice
    permission: blg.internal
  blg_auto_choice:
    description: Internal – called by the on-join choice button; opens login/register automatically.
    usage: /blg_auto_choice
    permission: blg.internal
  blg_rules_accept:
    description: Internal – called by the rules accept button.
    usage: /blg_rules_accept
    permission: blg.internal
  blg_rules_leave:
    description: Internal – called by the rules leave button.
    usage: /blg_rules_leave
    permission: blg.internal
  blg_rules_page:
    description: Internal – navigates to a specific rules page.
    usage: /blg_rules_page <page>
    permission: blg.internal

permissions:
  blg.openlogin:
    description: Allows using /openlogin.
    default: true
  blg.openregister:
    description: Allows using /openregister.
    default: true
  blg.openauto:
    description: Allows using /openauto.
    default: true
  blg.openprelogin:
    description: Allows using /openprelogin.
    default: true
  blg.openprelogin.others:
    description: Allows opening the pre-login dialog for other players with /openprelogin <player>.
    default: op
  blg.openauto.others:
    description: Allows forcing the login dialog open for other players with /openauto <player>.
    default: op
  blg.internal:
    description: Internal permission for dialog submit and navigation commands.
    default: true
  blg.admin:
    description: Full administrative access.
    default: op
    children:
      blg.openlogin: true
      blg.openregister: true
      blg.openauto: true
      blg.openprelogin: true
      blg.openprelogin.others: true
      blg.openauto.others: true
      blg.internal: true
