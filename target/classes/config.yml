# BetterLoginGui configuration

messages:
  # Prefix for all plugin messages
  prefix: "&8[&bBLG&8] &r"

  # Shown to the player before opening a dialog (dialogs require a screen interaction first)
  login-prompt: "&7Please enter your credentials in the dialog."
  register-prompt: "&7Please fill in the registration dialog."
  auto-prompt: "&7Opening the appropriate dialog for you..."

  # Shown when AuthMe is not available and /openauto is used
  authme-unavailable: "&cAuthMe integration is unavailable. Using login dialog by default."
  openauto-usage: "&cUsage: /openauto or /openauto <player> &7(requires permission for other players)"
  openauto-console-usage: "&cConsole must use /openauto <player>."
  no-permission-others: "&cYou do not have permission to open the login GUI for other players."
  no-permission: "&cYou do not have permission to use this command."
  player-not-found: "&cThat player is not online."
  force-opened-login: "&aOpened the login dialog for &e%player%&a."

  # Shown if an internal command is called outside of a dialog context
  internal-command-blocked: "&cThis command can only be used through the login/register dialog."

  # Shown when an internal submit command fires correctly
  login-forwarded: "&aForwarding your login to AuthMe..."
  register-forwarded: "&aForwarding your registration to AuthMe..."

  # Shown when register passwords do not match
  password-mismatch: "&cPasswords do not match. Please try again."

  # Shown as the kick message when a player leaves via the rules "Leave Server" button
  rules-leave-kick: "&cYou must accept the server rules to play."

# Automatically open the login/register dialog when a player joins.
# If AuthMe is installed and reports the player is already authenticated, no GUI is opened.
autojoinlogingui: false

# Alias with kebab-case naming.
auto-join-login-gui: false

# Legacy alias kept for backwards compatibility with older configs.
auto-open-on-join: false

# How many ticks to wait after a player joins before opening the first dialog.
# Increase this if players see the dialog during the loading screen.
# Default: 20 ticks = 1 second.
join-dialog-delay-ticks: 20

dialog:
  # All dialog text below supports legacy color codes via &

  # --- Login-stub dialog (shown to registered players before the actual login form) ---
  login-choice-title: "&lWelcome back!"
  login-choice-body: "&7Click the button below to log in to the server."
  login-choice-button: "&aLogin"

  # --- Register-stub dialog (shown to new players before the actual register form) ---
  register-choice-title: "&lWelcome!"
  register-choice-body: "&7It looks like you don't have an account yet.\n&7Click the button below to create one."
  register-choice-button: "&aRegister"

  # --- Login dialog ---
  login-title: "&lLogin"
  register-title: "&lRegister"

  # Body text displayed inside each dialog
  login-body: "&7Enter your password to log in to the server."
  register-body: "&7Choose a password to create your account.\n&7Enter the same password twice to confirm."

  # Button labels
  login-button: "&aLogin"
  register-button: "&aRegister"
  cancel-button: "&cCancel"

  # Input field labels
  password-label: "&fPassword"
  confirm-password-label: "&fConfirm Password"

  # Hide password characters in login/register fields when supported by your
  # Paper Dialog API build. On supporting builds this also enables the client
  # show/hide control for the password field.
  password-masking-enabled: true

  # --- Rules dialog ---
  # %seconds% is replaced with the remaining wait time
  rules-title: "&6&lServer Rules"
  rules-wait-title: "&6&lServer Rules &e(wait %seconds%s)"
  rules-accept-button: "&aAccept"
  rules-leave-button: "&cLeave Server"
  rules-prev-button: "&7< Previous"
  rules-next-button: "&7Next >"

# Rules system
rules:
  # Set to true to enable the rules screen on join (shown before the choice dialog)
  enabled: false

  # How many seconds the player must spend on the rules screen before they can
  # click Accept or Leave Server.
  wait-seconds: 15

  # Page system for long rule sets.
  # If the Dialog API supports scrolling natively the page system is not needed;
  # enable it if your rules are too long to display in a single dialog.
  pages:
    enabled: false
    # How many rules lines to show per page when pages are enabled.
    lines-per-page: 10

