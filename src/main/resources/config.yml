# ============================================================
#   BetterLoginGui (BLG) - Full Configuration
#   Every GUI element, sound, message and colour is
#   customizable here.  Use & colour codes everywhere.
# ============================================================

# ── General ──────────────────────────────────────────────────
general:
  # Print extra info to console
  debug: false
  # Automatically close dialogs on world change
  close-on-world-change: true
  # Automatically close dialogs on disconnect
  close-on-disconnect: true
  # Check AuthMe asynchronously (recommended)
  async-authme-check: true
  # Show *** instead of password length in lore
  password-field-mask: true

# ── AuthMe Integration ────────────────────────────────────────
authme:
  # Use AuthMe Java API (true = recommended; false = command fallback)
  use-api: true
  # Fallback command to check if a player is registered
  # (only used when use-api is false)
  check-command: "authme check {player}"
  # Commands executed as the PLAYER
  commands:
    login: "login {password}"
    register: "register {password} {confirm}"

# ── Error Detection ───────────────────────────────────────────
error-detection:
  enabled: true
  # Regex patterns matched against plain-text chat messages
  patterns:
    - "(?i).*wrong password.*"
    - "(?i).*incorrect password.*"
    - "(?i).*not logged in.*"
    - "(?i).*please register.*"
    - "(?i).*already registered.*"
    - "(?i).*password.*wrong.*"
    - "(?i).*failed.*login.*"
    - "(?i).*error.*password.*"
    - "(?i).*invalid.*password.*"
  # Chat prefixes that indicate an AuthMe message
  prefixes:
    - "[AuthMe]"
    - "[Auth]"

# ── Cooldown ──────────────────────────────────────────────────
cooldown:
  # Seconds before the Confirm button becomes clickable
  confirm-seconds: 5

# ── Sounds ───────────────────────────────────────────────────
sounds:
  enabled: true
  dialog-open:
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 0.6
    pitch: 1.2
  dialog-close:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 0.5
    pitch: 0.8
  button-click:
    sound: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.0
  error:
    sound: ENTITY_VILLAGER_NO
    volume: 0.8
    pitch: 0.9
  success:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.5
    pitch: 1.2
  cooldown-wait:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 0.4
    pitch: 0.5

# ── Messages ──────────────────────────────────────────────────
messages:
  prefix: "&8[&bBLG&8] "
  no-permission: "&cYou don't have permission to do that."
  player-only: "&cOnly players can use this command."
  already-open: "&eYou already have a dialog open."
  authme-not-found: "&cAuthMe is not loaded. Contact an administrator."
  reload-success: "&aBLG configuration reloaded."

  register:
    passwords-mismatch: "&cPasswords do not match! Please try again."
    passwords-empty: "&cPlease fill in both password fields."
    password-empty: "&cPlease enter a password."

  login:
    password-empty: "&cPlease enter a password."

  confirm:
    cooldown-wait: "&ePlease wait &6{remaining}s &ebefore confirming."

# ── Anvil Input ───────────────────────────────────────────────
# Text boxes are implemented via Anvil rename trick.
anvil-input:
  login-password:
    title: "&8» &bEnter Password"
    item-material: PAPER
    item-name: "&7Click here and type your password..."
    item-lore:
      - "&8Press the arrow ( → ) when done"

  register-password:
    title: "&8» &6Create Password"
    item-material: PAPER
    item-name: "&7Type your desired password..."
    item-lore:
      - "&8Press the arrow ( → ) when done"

  register-confirm:
    title: "&8» &6Confirm Password"
    item-material: PAPER
    item-name: "&7Type your password again..."
    item-lore:
      - "&8Press the arrow ( → ) when done"

# ── Login Dialog ──────────────────────────────────────────────
login-dialog:
  title: "&8[ &b&lLogin &8]"
  rows: 4  # 4 rows = 36 slots

  # ── Filler item (background) ──────────────────────────────
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    # Which slots to fill (empty list = fill all empty slots)
    slots: []

  # ── Title decorative item ─────────────────────────────────
  title-item:
    enabled: true
    material: NAME_TAG
    slot: 4
    name: "&b&lLogin"
    lore:
      - "&7Enter your password to log in to the server."

  # ── Info item ─────────────────────────────────────────────
  info-item:
    enabled: true
    material: BOOK
    slot: 13
    name: "&bWelcome back, &e{player}&b!"
    lore:
      - ""
      - "&7Please enter your password below"
      - "&7to continue to the server."
      - ""

  # ── Password field ────────────────────────────────────────
  password-field:
    material: PAPER
    slot: 20
    # When no password is set yet
    name: "&ePassword"
    lore:
      - "&7&o(not set)"
      - ""
      - "&8Click to enter your password"
    # When a password has been typed
    name-set: "&aPassword"
    lore-set:
      - "&a&o(set ✔)"
      - ""
      - "&8Click to change your password"

  # ── Login button ──────────────────────────────────────────
  login-button:
    material: LIME_WOOL
    slot: 29
    name: "&a&lLogin »"
    lore:
      - "&7Click to log in with your password."
    # Appearance when password is not yet entered
    material-disabled: GRAY_WOOL
    name-disabled: "&7&lLogin »"
    lore-disabled:
      - "&7Enter a password first."

  # ── Cancel button ─────────────────────────────────────────
  cancel-button:
    material: RED_WOOL
    slot: 31
    name: "&c&lCancel ✗"
    lore:
      - "&7Click to close this dialog."

  # ── Switch-to-Register button ─────────────────────────────
  switch-register-button:
    material: YELLOW_WOOL
    slot: 33
    name: "&e&lRegister →"
    lore:
      - "&7Don't have an account?"
      - "&7Switch to Register."

# ── Register Dialog ───────────────────────────────────────────
register-dialog:
  title: "&8[ &6&lCreating a Password &8]"
  rows: 4

  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: " "
    slots: []

  title-item:
    enabled: true
    material: WRITABLE_BOOK
    slot: 4
    name: "&6&lCreating a Password"
    lore:
      - "&7Register a new account on this server."

  welcome-item:
    enabled: true
    material: PLAYER_HEAD
    slot: 13
    name: "&eWelcome, &6{player}&e!"
    lore:
      - ""
      - "&7You must create a password to log"
      - "&7in to the server. Please fill in"
      - "&7the fields below to continue."
      - ""

  password-field:
    material: PAPER
    slot: 20
    name: "&ePassword"
    lore:
      - "&7&o(not set)"
      - ""
      - "&8Click to enter your password"
    name-set: "&aPassword"
    lore-set:
      - "&a&o(set ✔)"
      - ""
      - "&8Click to change your password"

  confirm-field:
    material: PAPER
    slot: 24
    name: "&eConfirmation"
    lore:
      - "&7&o(not set)"
      - ""
      - "&8Click to confirm your password"
    name-set: "&aConfirmation"
    lore-set:
      - "&a&o(set ✔)"
      - ""
      - "&8Click to re-enter your password"

  done-button:
    material: LIME_WOOL
    slot: 29
    name: "&a&lDone ✔"
    lore:
      - "&7Click when both fields are filled."
    material-disabled: GRAY_WOOL
    name-disabled: "&7&lDone"
    lore-disabled:
      - "&7Fill in both fields first."

  cancel-button:
    material: RED_WOOL
    slot: 31
    name: "&c&lCancel ✗"
    lore:
      - "&7Click to close this dialog."

  switch-login-button:
    material: YELLOW_WOOL
    slot: 33
    name: "&e&lLogin →"
    lore:
      - "&7Already have an account?"
      - "&7Switch to Login."

  # Optional: error item shown when passwords don't match
  error-item:
    enabled: true
    material: BARRIER
    slot: 4
    name: "&c&l⚠ Error"
    lore: []  # Filled dynamically

# ── Confirm Dialog ────────────────────────────────────────────
confirm-dialog:
  title: "&8[ &c&lConfirm Registration &8]"
  rows: 3

  filler:
    enabled: true
    material: RED_STAINED_GLASS_PANE
    name: " "
    slots: []

  title-item:
    enabled: true
    material: BARRIER
    slot: 4
    name: "&c&l⚠ Confirm Registration"
    lore:
      - "&7Review your password carefully."

  warning-item:
    enabled: true
    material: GOLD_BLOCK
    slot: 13
    name: "&6&lYour Password:"
    lore:
      - ""
      - "&e{password}"
      - ""
      - "&cMake sure this is exactly what you want."
      - "&7You cannot change it without an admin."

  # Confirm button (locked during cooldown)
  confirm-button:
    slot: 11
    # Active state (after cooldown)
    material: GREEN_WOOL
    name: "&a&lConfirm ✔"
    lore:
      - "&7Click to complete registration."
    # Locked state (during cooldown)
    material-cooldown: GRAY_WOOL
    name-cooldown: "&7Confirm &8({remaining}s)"
    lore-cooldown:
      - "&8Please wait before confirming..."

  back-button:
    material: YELLOW_WOOL
    slot: 15
    name: "&e&lGo Back ←"
    lore:
      - "&7Click to go back to registration."

# ── Error Dialog ──────────────────────────────────────────────
error-dialog:
  title: "&8[ &c&lError &8]"
  rows: 3

  filler:
    enabled: true
    material: RED_STAINED_GLASS_PANE
    name: " "
    slots: []

  error-icon:
    enabled: true
    material: BARRIER
    slot: 4
    name: "&c&l✗ Authentication Error"
    lore: []

  error-message-item:
    enabled: true
    material: PAPER
    slot: 13
    name: "&c&lError Details:"
    # {error} is replaced with the actual error message
    lore:
      - ""
      - "&c{error}"
      - ""
      - "&7Please try again or contact staff."

  # Shown when the error context is LOGIN
  back-login-button:
    material: LIME_WOOL
    slot: 11
    name: "&a&l← Back to Login"
    lore:
      - "&7Return to the login dialog."

  # Shown when the error context is REGISTER
  back-register-button:
    material: YELLOW_WOOL
    slot: 15
    name: "&e&l← Back to Register"
    lore:
      - "&7Return to the registration dialog."

  close-button:
    material: RED_WOOL
    slot: 13
    # slot offset: placed right of centre when both back buttons are shown
    name: "&c&lClose"
    lore:
      - "&7Close this dialog."
