# ============================================================
#  BetterLoginGui – Full Configuration
#  Every feature, button, message and timing is customizable.
# ============================================================

# ---------------------------------------------------------------------------
# Debug mode
# When true, extra diagnostic information is written to the console.
# Helpful for troubleshooting Velocity setups, dialog API issues, etc.
# ---------------------------------------------------------------------------
debug: false

# ---------------------------------------------------------------------------
# Velocity / proxy backend support
#
# BLG auto-detects proxy mode: when this Paper server is running in
# offline-mode (server.properties online-mode=false), the per-player
# online-mode check is disabled automatically.  This covers the typical
# Velocity / BungeeCord backend setup with no extra configuration needed –
# you do NOT need a separate Velocity-side plugin.
#
# Set velocity-backend: true only if your backend is in online-mode yet you
# still want to skip the per-player online-mode check (very rare setup).
#
# What this option does when true:
#   - Forces the per-player isOnlineMode() check off regardless of the
#     server's own online-mode setting (which auto-detection normally handles).
# ---------------------------------------------------------------------------
velocity-backend: false

# ---------------------------------------------------------------------------
# Auto-open settings
# ---------------------------------------------------------------------------

# Automatically open the login/register dialog when a player joins.
# If AuthMe is installed and reports the player is already authenticated, no
# GUI is opened.
autojoinlogingui: false

# Alias – kept for compatibility.
auto-join-login-gui: false

# Legacy alias – kept for backwards compatibility with older configs.
auto-open-on-join: false

# When true, players who authenticated with a Microsoft / Mojang premium
# account (online-mode players) are detected and the GUI is skipped for them.
# Cracked / offline-mode players still go through the normal flow.
#
# IMPORTANT: This is DISABLED by default because it is only useful on
# standalone cracked (offline-mode) servers that also allow premium logins.
#   - On online-mode servers every player is premium, so enabling this would
#     prevent the dialog from ever opening.
#   - On Velocity / BungeeCord backends the per-player online-mode flag is
#     unreliable and may silently skip cracked players.
#
# Only enable this if you run a standalone offline-mode server and want to
# skip the dialog for premium players who already authenticated via Mojang.
# Only relevant when autojoinlogingui is enabled.
skip-online-mode-players: false

# When true, players whose username contains a dot (.) at any position other
# than the very first character are automatically kicked on join.
# Examples:
#   .username  → ALLOWED  (Bedrock / Floodgate prefix)
#   username   → ALLOWED  (no dot)
#   user.name  → KICKED
#   username.  → KICKED
# Bedrock players (detected via Floodgate API or dot-prefix fallback) are
# always exempt from this check.
kick-dot-usernames: true

# When true, Bedrock players connected via Geyser / Floodgate are detected
# and the GUI is skipped for them.
# Detection priority:
#   1. Floodgate API (if the Floodgate plugin is installed)
#   2. Fallback: player username contains a dot (.), which is the default
#      Floodgate name prefix for Bedrock players.
# Only relevant when autojoinlogingui is enabled.
skip-bedrock-players: true

# When true, Bedrock players (detected via Geyser / Floodgate) are
# automatically authenticated through AuthMe's forceLogin API on join.
# Requires both AuthMe and the Floodgate API (or dot-in-name fallback).
# This is different from skip-bedrock-players: skip-bedrock-players just
# hides the dialog, while this option actually logs the player in.
# Only relevant when autojoinlogingui is enabled.
auto-authenticate-bedrock: false

# When true, premium (paid) Minecraft accounts are detected by querying the
# Mojang API and automatically authenticated through AuthMe's forceLogin API.
# This is a reliable check that works correctly on Velocity / BungeeCord
# backends where Player.isOnlineMode() may be unreliable.
# Requires AuthMe to be installed. Cracked / non-premium players still see
# the normal login or register dialog.
auto-authenticate-premium: false

# ---------------------------------------------------------------------------
# Timing settings
# ---------------------------------------------------------------------------

# When true, the dialog opens as soon as possible (1-tick delay) and skips
# the choice dialog entirely – the actual login or register form is shown
# directly.  The dialog appears during/right after the loading screen.
# Overrides join-dialog-delay-ticks when enabled.
open-before-ingame: false

# How many ticks to wait after a player joins before opening the first dialog.
# Increase this if players see the dialog during the loading screen, or if you
# are running behind a Velocity proxy (proxy hand-off adds latency).
# Default: 20 ticks = 1 second.  Proxy / Velocity recommended: 40–60 ticks.
join-dialog-delay-ticks: 20

# How long (ticks) to keep re-sending the on-join choice dialog before giving
# up.  Default: 160 ticks = 8 seconds.
join-choice-timeout-ticks: 160

# How often (ticks) to re-send the choice dialog during the spam stage.
# Lower = more responsive; higher = less network traffic.
# Default: 2 ticks ≈ 100 ms.
join-choice-spam-interval-ticks: 2

# ---------------------------------------------------------------------------
# Messages
# All messages support legacy colour codes via &
# ---------------------------------------------------------------------------
messages:
  # Prefix prepended to every plugin message.
  prefix: "&8[&bBLG&8] &r"

  # Shown as a chat fallback when the Dialog API is unavailable on the server.
  login-prompt: "&7Please enter your credentials in the dialog."
  register-prompt: "&7Please fill in the registration dialog."
  auto-prompt: "&7Opening the appropriate dialog for you..."

  # Shown when AuthMe is not available and /openauto is used.
  authme-unavailable: "&cAuthMe integration is unavailable. Using login dialog by default."

  # Usage / error messages for admin commands.
  openauto-usage: "&cUsage: /openauto or /openauto <player> &7(requires permission for other players)"
  openauto-console-usage: "&cConsole must use /openauto <player>."
  openprelogin-usage: "&cUsage: /openprelogin or /openprelogin <player> &7(requires permission for other players)"
  openprelogin-console-usage: "&cConsole must use /openprelogin <player>."
  no-permission-others: "&cYou do not have permission to open the login GUI for other players."
  no-permission: "&cYou do not have permission to use this command."
  player-not-found: "&cThat player is not online."
  force-opened-login: "&aOpened the login dialog for &e%player%&a."
  force-opened-prelogin: "&aOpened the pre-login dialog for &e%player%&a."

  # Shown if an internal /blg_* command is called outside a dialog context.
  internal-command-blocked: "&cThis command can only be used through the login/register dialog."

  # Shown when an internal submit command fires correctly.
  login-forwarded: "&aForwarding your login to AuthMe..."
  register-forwarded: "&aForwarding your registration to AuthMe..."

  # Shown when register passwords do not match.
  password-mismatch: "&cPasswords do not match. Please try again."
  login-failed: "&cLogin failed. Please try again."
  register-failed: "&cRegistration failed. Please try again."

  # Shown as the kick reason when a player is kicked for having a dot in their
  # username at an illegal position (not the first character).
  kick-dot-username-reason: "&cYour username contains a dot (.) which is not allowed.\n&7Please change your username and reconnect."

  # Shown as the kick reason when a player leaves via the rules "Leave Server" button.
  rules-leave-kick: "&cYou must accept the server rules to play."

  # Chat fallback – shown as a footer when rules are printed to chat (no Dialog API).
  rules-chat-fallback-footer: "&7Type &a/blg_rules_accept &7to accept or &c/blg_rules_leave &7to leave."

# ---------------------------------------------------------------------------
# Dialog content & appearance
# All text supports legacy colour codes via &
# ---------------------------------------------------------------------------
dialog:
  # ---- Unified on-join choice dialog ----------------------------------------
  # Shown repeatedly (spam stage) when autojoinlogingui is enabled.
  join-choice-title: "&lWelcome!"
  join-choice-body: "&7Click the button below to continue."
  join-choice-button: "&aRegister/Login"

  # ---- Login-stub dialog (registered players) --------------------------------
  # Shown before the actual login form; one click opens the password input.
  login-choice-title: "&lWelcome back!"
  login-choice-body: "&7Click the button below to log in to the server."
  login-choice-button: "&aOPEN LOGIN"

  # ---- Register-stub dialog (new players) ------------------------------------
  # Shown before the actual register form; one click opens the form.
  register-choice-title: "&lWelcome!"
  register-choice-body: "&7It looks like you don't have an account yet.\n&7Click the button below to create one."
  register-choice-button: "&aOPEN REGISTER"

  # ---- Login dialog ----------------------------------------------------------
  login-title: "&lLogin"
  login-body: "&7Enter your password to log in to the server."
  login-button: "&aLogin"

  # ---- Register dialog -------------------------------------------------------
  register-title: "&lRegister"
  register-body: "&7Choose a password to create your account.\n&7Enter the same password twice to confirm."
  register-button: "&aRegister"

  # ---- Shared button labels --------------------------------------------------
  cancel-button: "&cCancel"

  # ---- Input field labels ----------------------------------------------------
  password-label: "&fPassword"
  confirm-password-label: "&fConfirm Password"

  # Maximum number of characters allowed in password / text input fields.
  max-input-length: 100

  # Hide password characters in login/register fields.
  # Requires a Paper build that exposes a masking method in the Dialog API.
  password-masking-enabled: true

  # ---- Button widths (pixels) ------------------------------------------------
  # Adjust these to change how buttons look in the dialog UI.
  submit-button-width: 200
  cancel-button-width: 100
  nav-button-width: 100

  # ---- Forgot Password button (login dialog only) ----------------------------
  # When enabled, a "Forgot Password?" button appears on the login dialog.
  # Clicking it opens a chat message with a clickable link to the configured
  # URL.  If no URL is configured, the default Discord server link is used.
  forgot-password-enabled: true
  forgot-password-button: "&eForgot Password?"
  forgot-password-url: "https://discord.gg/99dHhqSx4j"
  forgot-password-body: "&7If you forgot your password, please open a ticket on our Discord server."

  # ---- Rules dialog ----------------------------------------------------------
  rules-title: "&6&lServer Rules"
  rules-accept-button: "&aAccept"
  rules-leave-button: "&cLeave Server"
  rules-prev-button: "&7< Previous"
  rules-next-button: "&7Next >"
  # Tooltip shown on the grayed-out Accept button while the player still waits.
  # Set to an empty string to show no tooltip.
  rules-wait-button-tooltip: "&ePlease read the rules before accepting."

# ---------------------------------------------------------------------------
# Rules system
# ---------------------------------------------------------------------------
rules:
  # Set to true to enable the rules screen on join (shown before the choice dialog).
  enabled: false

  # How many seconds the player must spend on the rules screen before they can
  # click Accept or Leave Server.
  wait-seconds: 15

  # Page system for long rule sets.
  # Enable if your rules are too long to fit in a single dialog screen.
  pages:
    enabled: false
    # How many rule lines to show per page when pages are enabled.
    lines-per-page: 10
