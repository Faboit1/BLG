name: BetterLoginGui
version: '${project.version}'
main: fr.faboit.blg.BLGPlugin
api-version: '1.21'
authors: [ Faboit1 ]
description: A modern dialog-based login/register UI system for Paper servers using AuthMe.
website: https://github.com/Faboit1/BLG

softdepend: [ AuthMe ]

commands:
  openlogin:
    description: Opens the login dialog
    usage: /openlogin
    permission: blg.use
    aliases: [ loginui, login-ui ]
  openregister:
    description: Opens the register dialog
    usage: /openregister
    permission: blg.use
    aliases: [ registerui, register-ui ]
  openauto:
    description: Automatically opens login or register dialog
    usage: /openauto
    permission: blg.use
    aliases: [ auth, authenticate, blgauto ]
  blgreload:
    description: Reloads BLG configuration
    usage: /blgreload
    permission: blg.admin

permissions:
  blg.use:
    description: Allows players to use BLG dialog commands
    default: true
  blg.admin:
    description: Allows admin commands (reload)
    default: op
  blg.bypass:
    description: Bypass dialog opening restrictions
    default: op
